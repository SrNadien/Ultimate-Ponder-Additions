plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${group}"
base {
    archivesName = "${mod_named}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "${neoversion}"

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', "${modid}"
            systemProperty "guideme.${modid}.guide.sources", file('src/main/resources/assets/' + modid + '/guides/' + modid + '/guide').getAbsolutePath()
            systemProperty "guideme.${modid}.guide.sourcesNamespace", "${modid}"
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', "${modid}"
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', "${modid}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'net.createmod.ponder'
            includeGroup 'net.createmod.catnip'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    compileOnly("net.createmod.ponder:Ponder-NeoForge-${mcversion}:${ponder_version}") { transitive = false }
    runtimeOnly("net.createmod.ponder:Ponder-NeoForge-${mcversion}:${ponder_version}") { transitive = false }
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${mcversion}:${flywheel_version}"

    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"

    if (project.findProperty('runtime_integrated_mods').toString().toBoolean()) {
        implementation("com.hrznstudio:titanium:${titanium_version}") { transitive = false }
        implementation("com.buuz135:industrialforegoing:${industrialforegoing_version}") { transitive = false }
        implementation("maven.modrinth:functional-storage:${functionalstorage_version}") { transitive = false }
        implementation("maven.modrinth:modern-chickens:${modernchickens_version}") { transitive = false }
        implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }

        implementation("maven.modrinth:ex-deorum:${exdeorum_version}") { transitive = false }
        implementation("maven.modrinth:botany-pots:${botanypots_version}") { transitive = false }
        implementation("maven.modrinth:bookshelf-lib:${bookshelf_version}") { transitive = false }
        implementation("net.darkhax.pricklemc:prickle-neoforge-${mcversion}:${prickle_version}") { transitive = false }
        implementation("maven.modrinth:pylons:${pylons_version}") { transitive = false }
        implementation("maven.modrinth:ars-nouveau:${arsnouveau_version}") { transitive = false }
        implementation("software.bernie.geckolib:geckolib-neoforge-${mcversion}:${geckolib_version}") { transitive = false }
        implementation("maven.modrinth:curios:${curios_version}") { transitive = false }
        implementation("mekanism:Mekanism:${mekanism_version}") { transitive = false }
        implementation("mekanism:Mekanism:${mekanism_version}:generators") { transitive = false }

        // Create is deliberately absent: 6.0.11 requires ponder [1.0.85,) and the
        // Ponder-NeoForge-1.21.1 artifact stops at 1.0.69, so the two cannot coexist.
        // Drop a Create jar in run/mods manually if you need its pack scenes.
    }
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": archivesBaseName,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1",
                "Implementation-Title": archivesBaseName,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mcversion              : mcversion,
            mod_version            : mod_version,
            modid                  : modid,
            author                 : author,
            mod_named              : mod_named,
            mod_name               : mod_name,
            tag_lanzador           : tag_lanzador,
            description            : project.description,
            license                : license,
            neoversion             : neoversion,
            loader_version         : loader_version,
            jei_version            : jei_version,
            ponder_version         : ponder_version,
            guideme_version        : guideme_version,
            industrialforegoing_version: industrialforegoing_version,
            titanium_version       : titanium_version,
            functionalstorage_version: functionalstorage_version,
            modernchickens_version : modernchickens_version,
            ae2_version            : ae2_version,
            flywheel_version       : flywheel_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.getRelease().set(21)
}

def githubMods = [
        "ModernFoundry-${mcversion}-${modernfoundry_version}-NeoForge.jar":
                "https://github.com/Modern-Mods/ModernFoundry/releases/download/v${modernfoundry_version}/ModernFoundry-${mcversion}-${modernfoundry_version}-NeoForge.jar",
        "Hilt-${mcversion}-${hilt_version}.jar":
                "https://github.com/Modern-Mods/Hilt/releases/download/v${hilt_version}/Hilt-${mcversion}-${hilt_version}.jar"
]

tasks.register('downloadGithubMods') {
    description = 'Downloads dev-runtime mods that are only published as GitHub releases.'
    def target = file('run/mods')
    outputs.files(githubMods.keySet().collect { new File(target, it) })
    onlyIf { project.findProperty('runtime_integrated_mods').toString().toBoolean() }
    doLast {
        target.mkdirs()
        githubMods.each { name, url ->
            def dest = new File(target, name)
            if (!dest.exists()) {
                logger.lifecycle("Downloading ${name}")
                dest.withOutputStream { out -> new URL(url).withInputStream { from -> out << from } }
            }
        }
    }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn 'downloadGithubMods'
}
